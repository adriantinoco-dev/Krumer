name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            backend_bin: resources/krumer-backend.exe
          - os: ubuntu-latest
            backend_bin: resources/krumer-backend

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-build.txt

      - name: Instalar dependências do Python
        run: pip install -r backend/requirements-build.txt

      - name: Buildar backend com PyInstaller
        run: pyinstaller krumer-backend.spec --clean --noconfirm

      - name: Copiar backend para resources/
        shell: bash
        run: |
          mkdir -p resources
          cp -R dist/krumer-backend/. resources/

      - name: Validar layout do backend empacotado
        shell: bash
        run: |
          test -f "${{ matrix.backend_bin }}"
          test -d resources/_internal

      - name: Instalar dependências do Node
        run: npm ci

      - name: Validar credenciais de assinatura do Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK)) {
            throw 'Secret WIN_CSC_LINK ausente. Releases Windows sem assinatura são bloqueadas.'
          }
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)) {
            throw 'Secret WIN_CSC_KEY_PASSWORD ausente. Releases Windows sem assinatura são bloqueadas.'
          }

      - name: Buildar e publicar app Windows assinado
        if: matrix.os == 'windows-latest'
        run: npm run build -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Verificar assinaturas dos executáveis Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/verify-windows-signatures.ps1

      - name: Buildar e publicar app Linux
        if: matrix.os == 'ubuntu-latest'
        run: npm run build:linux -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artefatos (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Krumer-Windows
          path: |
            dist/*.exe
          retention-days: 30

      - name: Upload artefatos (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Krumer-Linux
          path: |
            dist/*.AppImage
            dist/*.deb
          retention-days: 30
