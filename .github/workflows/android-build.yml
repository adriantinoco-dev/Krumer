name: Android Build (EAS local)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Profile do eas.json a usar"
        type: choice
        default: preview
        options:
          - development
          - preview
          - production

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependências
        run: npm ci

      - name: Instalar EAS CLI
        run: npm install -g eas-cli

      - name: Autenticar na Expo
        run: eas whoami
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Definir formato do artefato
        id: artifact
        shell: bash
        run: |
          if [ "${{ github.event.inputs.profile }}" = "production" ]; then
            extension="aab"
          else
            extension="apk"
          fi
          echo "extension=${extension}" >> "$GITHUB_OUTPUT"
          echo "path=${GITHUB_WORKSPACE}/mobile/krumer-mobile.${extension}" >> "$GITHUB_OUTPUT"
          echo "relative_path=mobile/krumer-mobile.${extension}" >> "$GITHUB_OUTPUT"

      - name: Build Android local
        run: |
          eas build \
            --platform android \
            --profile ${{ github.event.inputs.profile }} \
            --local \
            --non-interactive \
            --output "${{ steps.artifact.outputs.path }}"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Validar arquiteturas Android
        run: npm run test:android-abis -- "${{ steps.artifact.outputs.path }}"

      - name: Upload do artefato Android
        uses: actions/upload-artifact@v4
        with:
          name: krumer-mobile-${{ github.event.inputs.profile }}-${{ steps.artifact.outputs.extension }}
          path: ${{ steps.artifact.outputs.relative_path }}
          retention-days: 14
