<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Krumer — Biblioteca Pessoal de Livros e HQs</title>
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/library.css">
</head>
<body>

  <div id="app-root">
    
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="brand-container">
        <div class="brand-icon">K</div>
        <div class="brand-title">Krumer</div>
      </div>

      <div class="nav-section">
        <div class="nav-section-title">Biblioteca</div>
        <ul class="nav-list">
          <li class="nav-item active" data-category="all">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path>
            </svg>
            <span>Todos os itens</span>
          </li>
          <li class="nav-item" data-category="reading">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
            </svg>
            <span>Lendo atualmente</span>
          </li>
          <li class="nav-item" data-category="series">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
            </svg>
            <span>Séries & Mangás</span>
          </li>
        </ul>
      </div>

      <div class="nav-section" style="flex:1;">
        <div class="nav-section-title">Tags & Categorias</div>
        <div id="tags-container" class="tags-container">
          <span style="font-size:11px; color:var(--text-muted);">Carregando tags...</span>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-wrapper">
      
      <!-- Top Navbar Header -->
      <header class="app-header">
        <div class="search-box">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
          <input type="text" id="search-input" class="search-input" placeholder="Buscar por título ou autor...">
        </div>

        <div class="header-actions">
          <div class="sort-select-wrap">
            <span>Ordenar por:</span>
            <select id="sort-select" class="sort-select">
              <option value="title">Título (A-Z)</option>
              <option value="added_desc">Adicionados recentemente</option>
              <option value="rating_desc">Melhor avaliados</option>
              <option value="progress_desc">Maior progresso</option>
            </select>
          </div>

          <!-- Botão circular de Reescanear (implementacoes.md §1) -->
          <button id="btn-rescan" class="btn-rescan" title="Reescanear pastas já configuradas">
            <svg id="rescan-icon" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
            </svg>
          </button>

          <button id="btn-open-scan" class="btn btn-primary">
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path>
            </svg>
            Escanear Pasta
          </button>
        </div>
      </header>

      <!-- Main Library Grid Viewport -->
      <div class="library-viewport">
        <div class="section-header">
          <h1 class="section-title">
            Minha Biblioteca
            <span id="item-count" class="item-count">(0 itens)</span>
          </h1>
        </div>

        <!-- Dynamic Books Grid -->
        <div id="book-grid" class="book-grid">
          <!-- Book cards will be rendered dynamically by library.js -->
        </div>
      </div>

    </main>

  </div>

  <!-- Scan Folder Modal Dialog -->
  <div id="scan-modal" class="modal-backdrop">
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="modal-title">Escanear Pasta de Livros</h2>
        <button id="close-scan-modal" class="close-btn">&times;</button>
      </div>
      <form id="scan-form">

        <!-- 1. Campo de caminho + botão de seleção nativa abaixo (popup_escanear.md §1) -->
        <div class="form-group">
          <label class="form-label" for="scan-path-input">Caminho do diretório raiz</label>
          <input type="text" id="scan-path-input" class="form-input"
                 placeholder="Ex: C:\MeusLivros ou /home/usuario/livros" required>
          <!-- input oculto para seleção via webkitdirectory (fallback) -->
          <input type="file" id="folder-picker-input" webkitdirectory directory style="display:none">
          <!-- Botão com mesma largura (100%) abaixo do campo -->
          <button type="button" id="btn-browse-folder" class="btn btn-secondary scan-pick-btn" style="margin-top:8px; width:100%; justify-content:center;">
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path>
            </svg>
            Selecionar pasta
          </button>
        </div>

        <!-- 2. Opção de fonte do nome do livro (popup_escanear.md §2) -->
        <div class="form-group" style="margin-top:18px;">
          <label class="form-label">Exibir nome dos livros conforme:</label>
          <div class="radio-options-group">
            <label class="radio-option">
              <input type="radio" name="title_source" id="title-source-metadata" value="metadata" checked>
              <span>Metadados do arquivo</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="title_source" id="title-source-filename" value="filename">
              <span>Nome do arquivo</span>
            </label>
          </div>
        </div>

        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:24px;">
          <button type="button" class="btn btn-secondary" onclick="app.closeScanModal()">Cancelar</button>
          <button type="submit" class="btn btn-primary">Iniciar Escaneamento</button>
        </div>
      </form>
    </div>
  </div>


  <!-- Item Details Modal -->
  <div id="detail-modal" class="modal-backdrop">
    <div class="modal-card" style="width: 580px;">
      <div class="modal-header">
        <h2 class="modal-title">Detalhes do Livro</h2>
        <button id="close-detail-modal" class="close-btn">&times;</button>
      </div>
      <div class="detail-layout">
        <img id="detail-cover-img" class="detail-cover" src="" alt="Capa">
        <div class="detail-info">
          <div id="detail-title" class="detail-title">Título</div>
          <div id="detail-author" class="detail-author">Autor</div>
          <div id="detail-desc" class="detail-desc">Descrição</div>
          <div style="margin-top:auto;">
            <button class="btn btn-primary" onclick="alert('Leitor de arquivos integrado será ativado na Fase 3/4!')">Abrir Leitor</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Series Drawer (Slide-Over Panel) -->
  <div id="series-drawer" class="drawer-backdrop">
    <div class="drawer-panel">
      <div class="modal-header">
        <div>
          <h2 id="drawer-series-title" class="modal-title">Nome da Série</h2>
          <span id="drawer-series-count" style="font-size:12px; color:var(--text-muted);">0 capítulos</span>
        </div>
        <button id="close-drawer" class="close-btn">&times;</button>
      </div>

      <div id="drawer-chapter-list" class="chapter-list">
        <!-- Chapters list will be populated dynamically -->
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/library.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
