// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }

  afterEvaluate { project ->
    if (project.name != 'app') {
      def codegenTask = project.tasks.findByName('generateCodegenArtifactsFromSchema')
      if (codegenTask) {
        rootProject.project(':app').tasks.matching { it.name.startsWith('generateJsonModel') || it.name == 'preBuild' }.configureEach {
          dependsOn(codegenTask)
        }
      }
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"


rootProject.ext.ndkVersion = "27.1.12297006"



